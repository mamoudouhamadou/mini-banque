spring.application.name=mini-banque

# Le schéma appartient à Flyway (src/main/resources/db/migration).
# Hibernate se contente de VÉRIFIER que les entités correspondent aux tables, sans rien modifier.
spring.jpa.hibernate.ddl-auto=validate

# Désactive « Open Session In View » : les requêtes SQL ne se font que dans la couche service
# (sinon, des requêtes cachées peuvent partir pendant la génération du JSON).
spring.jpa.open-in-view=false

# Erreurs au format standard RFC 9457 (application/problem+json)
spring.mvc.problemdetails.enabled=true
server.error.include-stacktrace=never

# Actuator : état de santé et version déployée seulement, sans détails publics
management.endpoints.web.exposure.include=health,info
management.info.env.enabled=true
# /actuator/info → { "app": { "version": "<commit Git>" } } ; Render fournit RENDER_GIT_COMMIT
info.app.version=${RENDER_GIT_COMMIT:${VERSION:dev}}

# Port : celui imposé par l'hébergeur (variable PORT, ex. Render), sinon 8080
server.port=${PORT:8080}
# Derrière un proxy HTTPS (Render, nginx…) : utiliser les en-têtes X-Forwarded-* pour construire
# les bonnes URL (en-tête Location en https://…) et connaître la vraie adresse du client.
server.forward-headers-strategy=framework
# Compression des réponses (JSON, JS, CSS) : pages plus légères
server.compression.enabled=true

# Clé de signature des jetons JWT : lue dans la variable d'environnement JWT_SECRET (32 caractères minimum).
# Jamais de vraie valeur dans le code ! Sans elle, l'application refuse de démarrer.
minibanque.jwt.secret=${JWT_SECRET:}

# En développement, Spring Boot démarre compose.yaml (PostgreSQL) automatiquement
# et se connecte tout seul à la base : aucune URL à configurer.
